<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>ChorePoints</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#0b1220}header{background:#0b1220;color:white;text-align:center;padding:18px;position:sticky;top:0;z-index:2}.brand{text-align:left;font-weight:800;font-size:20px}.num{font-size:52px;font-weight:900}.label{letter-spacing:3px;color:#cbd5e1;font-size:13px}main{max-width:700px;margin:auto;padding:12px 14px 70px}.tabs{display:flex;gap:7px;position:sticky;top:104px;background:#f4f7fb;padding:8px 0;z-index:1}.tab{flex:1;border:0;padding:11px;border-radius:12px;background:white;font-weight:800}.active{background:#1677ff!important;color:white}.card{background:white;border:1px solid #dbe3ee;border-radius:16px;padding:16px;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-weight:800}.badge{display:inline-block;margin-top:6px;background:#eaf2ff;color:#0757c9;padding:4px 8px;border-radius:9px;font-size:13px;font-weight:700}.btn{border:0;border-radius:10px;background:#1677ff;color:white;padding:10px 13px;font-weight:800}.btn:disabled{opacity:.4}.muted{color:#64748b;font-size:14px}.hidden{display:none}.reward{display:flex;gap:12px;align-items:center}.icon{font-size:30px}.grow{flex:1}.notice{padding:11px;border-radius:11px;background:#eef5ff;margin-top:10px}.ok{background:#eafff5;color:#116b4a}.warn{background:#fff7df}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end;z-index:5}.modal.open{display:flex}.sheet{background:white;width:100%;padding:20px;border-radius:20px 20px 0 0;max-height:90vh;overflow:auto}input[type=file]{width:100%;margin:8px 0 12px}.close{float:right;border:0;padding:8px;border-radius:9px}</style></head><body><header><div class="brand">ChorePoints</div><div class="num" id="points">0</div><div class="label">POINTS</div></header><main><div class="tabs"><button class="tab active" onclick="tab('chores',this)">Chores</button><button class="tab" onclick="tab('prizes',this)">Prizes</button><button class="tab" onclick="tab('parent',this)">Parent</button></div><section id="chores"><h1>Your Chores</h1><p class="muted">Take photo proof before submitting.</p><div id="choreList"></div></section><section id="prizes" class="hidden"><h1>Prizes</h1><p class="muted">Spend your points on rewards.</p><div id="prizeList"></div></section><section id="parent" class="hidden"><h1>Parent Review</h1><p class="muted">Parents can review submissions and override the AI.</p><div id="reviews"></div></section></main><div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeM()">✕</button><h2 id="mt"></h2><div id="mb"></div></div></div><script>
const chores=[['Take out trash',15,0],['Everyone\'s Laundry',20,0],['Unload dishwasher',6,0],['Compost',5,0],['Water garden',5,0],['Fill up bird feeder',2,0],['Fill up hummingbird feeder',7,0],['Declutter',4,1]];const prizes=[['Sleepover',70,'🛏️'],['Extra friend',3,'👯'],['Go to movies',20,'🎬'],['Playdate at house',30,'🏠'],['Playdate at pool',40,'🏊'],['Prize box',25,'🎁']];let s=JSON.parse(localStorage.getItem('chorepoints')||'null')||{points:0,reviews:[],notifications:[]};function save(){localStorage.setItem('chorepoints',JSON.stringify(s));render()}function render(){points.textContent=s.points;choreList.innerHTML=chores.map((c,i)=>`<div class="card row"><div><div class="title">${c[0]}</div><span class="badge">+${c[1]} points</span>${c[2]?'<div class="muted">Before + after photos required</div>':''}</div><button class="btn" onclick="submitChore(${i})">Submit</button></div>`).join('');prizeList.innerHTML=prizes.map((p,i)=>`<div class="card reward"><div class="icon">${p[2]}</div><div class="grow"><b>${p[0]}</b><div class="muted">${p[1]} points</div></div><button class="btn" ${s.points<p[1]?'disabled':''} onclick="redeem(${i})">Redeem</button></div>`).join('');reviews.innerHTML=s.reviews.length?s.reviews.map((r,i)=>`<div class="card"><b>${r.chore}</b><div class="notice ${r.status==='AI approved'?'ok':r.status==='AI rejected'?'warn':''}"><b>${r.status}</b><br>${r.reason}</div>${r.status==='AI review needed'||r.status==='AI approved'||r.status==='AI rejected'?`<button class="btn" onclick="approve(${i})">Approve</button> <button class="btn" style="background:#111827" onclick="reject(${i})">Reject</button>`:''}</div>`).join(''):'<div class="card">No chore submissions.</div>'}function tab(id,b){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function submitChore(i){let c=chores[i];let body=c[2]?`<p><b>${c[0]}</b> — ${c[1]} points</p><b>Before photo</b><input id="before" type="file" accept="image/*" capture="environment"><b>After photo</b><input id="after" type="file" accept="image/*" capture="environment">`:`<p><b>${c[0]}</b> — ${c[1]} points</p><b>Photo proof</b><input id="photo" type="file" accept="image/*" capture="environment">`;body+=`<br><button class="btn" onclick="send(${i})">Send for AI review</button>`;mt.textContent='Chore proof';mb.innerHTML=body;modal.classList.add('open')}function closeM(){modal.classList.remove('open')}function send(i){let c=chores[i];if(c[2]&&(!before.files[0]||!after.files[0]))return alert('Both before and after photos are required.');if(!c[2]&&!photo.files[0])return alert('A photo is required.');s.reviews.push({chore:c[0],points:c[1],status:'AI review needed',reason:'The photo submission is ready for AI review. Connect a vision service to perform the actual image check.'});closeM();save();alert('Submitted for AI review!')}function approve(i){let r=s.reviews[i];if(r.status==='Approved by parent')return;r.status='Approved by parent';s.points+=r.points;s.notifications.push('Chore approved: '+r.chore+' +'+r.points+' points.');save()}function reject(i){let r=s.reviews[i];r.status='Rejected by parent';s.notifications.push('Chore rejected: '+r.chore);save()}function redeem(i){let p=prizes[i];if(s.points<p[1])return;if(p[0]==='Extra friend')return alert('1 extra friend = 3 points. 2 extra friends = 5 points total.');let cost=p[1];if(p[0]==='Sleepover'&&confirm('Add 2 extra friends for the 5-point deal?')){if(s.points<75)return alert('You need 75 points for a sleepover + 2 extra friends.');cost=75}s.points-=cost;s.notifications.push('Reward redeemed: '+p[0]+'. Parent notification.');save();alert('Reward redeemed! Parent notification added.')}render();</script></body></html>
